name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Publish (skip if this version is already on the registry)
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "pi-quicksave@${version}" version >/dev/null 2>&1; then
            echo "pi-quicksave@${version} is already published; skipping"
          else
            npm publish
          fi
