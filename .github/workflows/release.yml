name: release

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        default: pi-quicksave
        options:
          - pi-quicksave
          - pi-rename-session
          - pi-hud

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run checks
        working-directory: ${{ github.event.inputs.package }}
        run: |
          npm ci
          npm run check
          npm test
      - name: Publish to npm
        working-directory: ${{ github.event.inputs.package }}
        run: npm publish --provenance --access public
