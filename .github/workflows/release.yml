name: release

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        default: pi-quicksave
        options:
          - pi-quicksave
          - pi-rename-session
          - pi-hud
      bump:
        description: "Semver bump to apply before publishing"
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run checks
        working-directory: ${{ github.event.inputs.package }}
        run: |
          npm ci
          npm run check
          npm test
      - name: Bump version
        working-directory: ${{ github.event.inputs.package }}
        run: npm version ${{ github.event.inputs.bump }} --no-git-tag-version
      - name: Commit version bump and merge to main
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pkg="${{ github.event.inputs.package }}"
          ver="$(node -p "require('./$pkg/package.json').version")"
          branch="chore/release-$pkg-$ver"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$pkg/package.json"
          [ -f "$pkg/package-lock.json" ] && git add "$pkg/package-lock.json"
          git commit -m "chore(release): publish $pkg@$ver"
          git switch -c "$branch"
          git push -u origin "$branch"
          pr="$(gh pr create --base main --head "$branch" --title "chore(release): publish $pkg@$ver" --body "Auto-generated by the release workflow.")"
          # PRs opened by GITHUB_TOKEN don't auto-trigger pull_request CI, so
          # dispatch ci.yml explicitly onto the bump branch; its jobs post the
          # quicksave/rename-session checks the PR needs before it can merge.
          gh workflow run ci.yml --ref "$branch"
          # Wait for check runs to register before watching so gh pr checks
          # doesn't bail on an empty rollup.
          for i in $(seq 1 30); do
            n="$(gh pr view "$pr" --json statusCheckRollup -q '.statusCheckRollup | length' 2>/dev/null || echo 0)"
            [ "${n:-0}" -gt 0 ] && break
            sleep 5
          done
          gh pr checks "$pr" --watch --interval 10 >/dev/null
          gh pr merge "$pr" --squash --delete-branch
      - name: Publish to npm
        working-directory: ${{ github.event.inputs.package }}
        run: npm publish --provenance --access public
