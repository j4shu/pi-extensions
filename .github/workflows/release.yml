name: release

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        default: pi-quicksave
        options:
          - pi-quicksave
          - pi-rename-session
          - pi-hud
      bump:
        description: "Semver bump from the latest published version"
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Run checks
        working-directory: ${{ github.event.inputs.package }}
        run: |
          npm ci
          npm run check
          npm test
      # The registry is the source of truth for versions; main's package.json
      # is allowed to lag. Bumping from the published version makes collisions
      # impossible and needs no commit-back to main (which GITHUB_TOKEN PRs
      # can't run CI for anyway).
      - name: Bump version (anchored to registry)
        working-directory: ${{ github.event.inputs.package }}
        run: |
          name="$(node -p 'require("./package.json").name')"
          cur="$(npm view "$name" version 2>/dev/null || true)"
          if [ -n "$cur" ]; then
            npm version "$cur" --no-git-tag-version
            npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          else
            echo "Not on the registry yet; publishing local version $(node -p 'require("./package.json").version') as-is"
          fi
      - name: Publish to npm
        working-directory: ${{ github.event.inputs.package }}
        run: npm publish --provenance --access public
