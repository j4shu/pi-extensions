name: release

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        default: pi-quicksave
        options:
          - pi-quicksave
          - pi-rename-session
          - pi-hud
      bump:
        description: "Semver bump to apply before publishing"
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run checks
        working-directory: ${{ github.event.inputs.package }}
        run: |
          npm ci
          npm run check
          npm test
      - name: Bump version
        working-directory: ${{ github.event.inputs.package }}
        run: npm version ${{ github.event.inputs.bump }} --no-git-tag-version
      - name: Publish to npm
        working-directory: ${{ github.event.inputs.package }}
        run: npm publish --provenance --access public
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${{ github.event.inputs.package }}/package.json
          git commit -m "chore(release): publish ${{ github.event.inputs.package }}@$(node -p "require('./${{ github.event.inputs.package }}/package.json').version")"
          git push
