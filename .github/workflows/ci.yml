name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quicksave:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi-quicksave
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pi-quicksave/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  rename-session:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi-rename-session
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pi-rename-session/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  hud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi-hud
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pi-hud/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
