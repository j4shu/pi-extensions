name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quicksave:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quicksave
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: quicksave/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  rename-session:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rename-session
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: rename-session/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
