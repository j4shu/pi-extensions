# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
  # Dormant until the first .github/workflows file exists; GitHub Actions
  # updates only scan existing workflow files.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
