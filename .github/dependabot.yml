version: 2
updates:
  # One glob entry covers every package dir; new pi-* extensions are
  # picked up automatically (each dir keeps its own package-lock.json).
  - package-ecosystem: "npm"
    directories:
      - "/pi-*"
    schedule:
      interval: "weekly"
    groups:
      earendil-works:
        patterns: ["@earendil-works/*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
